name: News YouTube Bot

on:
  schedule:
    # Запуск каждые 2 часа (0 минут)
    - cron: '0 */2 * * *'
  # Возможность запустить вручную
  workflow_dispatch:

# Защита от одновременных запусков (чтобы не было конфликтов при коммите)
concurrency:
  group: news-bot
  cancel-in-progress: false

# Даем права на запись, чтобы бот мог сохранять файлы состояния
permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
        id: setup-ffmpeg
        with:
          ffmpeg-version: release

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python main.py

      - name: Commit state files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add posted_hashes.txt posted_news.txt posted_videos.txt published_titles.txt
          
          git diff --cached --quiet && echo "Нет изменений для коммита" && exit 0
          
          git commit -m "chore: update bot state [skip ci]"
          
          git pull --rebase origin main
          git push
